<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles/index.css" />
    <title>Web Storage</title>
  </head>
  <body>
    <div class="container container-index mt-5">
      <div class="titulo1">
        <h1>Ejercicio Storage</h1>
      </div>
      <form
        class="form-nombre w-75"
        style="
          border: 1px solid rgba(128, 128, 128, 0.596);
          border-radius: 5px;
          padding: 1rem;
        "
      >
        <div class="mb-3">
          <label for="entradaNombre" class="form-label">NOMBRE</label>
          <input
            type="text"
            class="form-control"
            id="entradaNombre"
            aria-describedby="ayudaNombre"
          />
          <div id="ayudaNombre" class="form-text">
            Ingresa tu nombre completo por favor.
          </div>
        </div>
        <div class="mb-3">
          <button type="submit" id="btnGuardar" class="btn btn-success">
            Guardar
          </button>
        </div>
        <div class="mb-3">
          <a href="./welcome.html">¡Avanza a la vista <i>Welcome!</i></a>
        </div>
      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
    <script src="./js/main.js"></script>
  </body>
</html>
